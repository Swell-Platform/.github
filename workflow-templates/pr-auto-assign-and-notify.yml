name: PR auto assign and notify

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr-auto-assign-and-notify:
    uses: Swell-Platform/.github/.github/workflows/pr-auto-assign-and-notify.yml@main
    secrets: inherit
